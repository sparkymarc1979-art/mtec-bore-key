<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTEC Bore and Key Quoting Tool</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #111827;
      --card: #1f2937;
      --card-2: #273449;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: #475569;
      --blue: #f97316;
      --blue-dark: #ea580c;
      --dark: #020617;
      --green-bg: #14351f;
      --green-text: #86efac;
      --amber-bg: #422006;
      --amber-text: #facc15;
      --red-bg: #450a0a;
      --red-text: #fecaca;
      --steel: #94a3b8;
      --orange: #f97316;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #334155 0, #111827 42%, #020617 100%);
      color: var(--text);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    h1 { margin: 0; font-size: 32px; }
    h2 { margin-top: 0; }
    h3 { margin-bottom: 8px; }

    .subtitle {
      color: var(--muted);
      margin-top: 6px;
    }

    .app-version {
      display: inline-block;
      margin-top: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    .version-date {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .version-footer {
      margin-top: 5px;
      padding: 8px 0 15px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
      gap: 22px;
    }

    .card {
      background: linear-gradient(145deg, var(--card), var(--card-2));
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.28); border: 1px solid rgba(148,163,184,0.25);
      margin-bottom: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 6px;
      font-size: 14px;
    }

    select, input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 15px;
      background: #0f172a; color: #f8fafc;
    }

    input:disabled {
      background: #e2e8f0;
      color: #94a3b8;
    }

    .help {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .summary-box {
      background: rgba(15,23,42,0.55);
      border-radius: 14px;
      padding: 13px;
      color: #cbd5e1;
      line-height: 1.5;
      min-height: 90px;
    }

    .price-box {
      background: linear-gradient(160deg, #020617, #111827); border: 1px solid #475569;
      color: white;
      border-radius: 18px;
      padding: 20px;
      margin: 14px 0;
    }

    .price-label {
      color: #cbd5e1;
      font-size: 14px;
      margin: 0;
    }

    .unit-price {
      font-size: 44px;
      font-weight: 800;
      margin: 4px 0 18px;
    }

    .line-total {
      font-size: 28px;
      font-weight: 700;
      margin: 4px 0 0;
    }

    .details {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
    }

    .warning {
      background: var(--amber-bg);
      white-space: pre-line;
      color: var(--amber-text);
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      display: none;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover { background: var(--blue-dark); }

    button.secondary {
      background: #0f172a; color: #f8fafc;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover { background: rgba(15,23,42,0.55); }

    button.danger {
      background: #991b1b;
    }

    .admin-section { display: none; }
    .admin-section.open { display: block; }

    .pass {
      background: var(--green-bg);
      color: var(--green-text);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 14px;
    }

    .fail {
      background: var(--red-bg);
      color: var(--red-text);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 14px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 12px;
      font-size: 14px;
    }

    th, td {
      text-align: left;
      border-bottom: 1px solid #475569;
      padding: 9px;
    }

    th { background: rgba(15,23,42,0.55); }

    .settings-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .quote-output {
      white-space: pre-wrap;
      background: rgba(15,23,42,0.55);
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      color: #e2e8f0;
      display: block;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      max-width: 120px;
      max-height: 82px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 12px;
      padding: 8px;
      border: 1px solid #475569;
    }

    .logo-fallback {
      display: none;
      width: 100px;
      height: 64px;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f97316;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 1px;
      border: 1px solid #475569;
      border-radius: 12px;
    }

    h1::after {
      content: "";
      display: block;
      width: 120px;
      height: 4px;
      margin-top: 10px;
      background: linear-gradient(90deg, var(--orange), transparent);
      border-radius: 999px;
    }
@media (max-width: 850px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
      .unit-price { font-size: 38px; }
      .page { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <img src="./LOGO.png" alt="MTEC Logo" class="logo" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'" />
        <div id="logoFallback" class="logo-fallback">MTEC</div>
        <div>
          <h1>MTEC Bore and Key Quoting Tool</h1>
          <div class="subtitle">Staff-friendly pricing calculator for metric and imperial machining work.</div>
          <div class="app-version" id="appVersionHeader">Version 4.2</div>
        </div>
      </div>
      <div class="button-row">
                <button type="button" class="secondary" id="resetQuoteButton" onclick="return resetQuote(event)">Reset Quote</button>
        <button class="place-order-btn" onclick="copyQuote()">Place Order</button>
      </div>
    </header>

    <section class="grid">
      <div class="card">
        <div class="form-grid">
          <div>
            <label for="unit">Unit System</label>
            <select id="unit" onchange="onUnitChange()">
              <option>Metric</option>
              <option>Imperial</option>
            </select>
          </div>

          <div>
            <label for="bore">Bore Size</label>
            <select id="bore" onchange="onBoreChange()"></select>
          </div>

          <div>
            <label for="length">Bore Length (up to and inc)</label>
            <select id="length" onchange="calculateAndRender()"></select>
          </div>

          <div>
            <label for="keywayRequired">Keyway Required?</label>
            <select id="keywayRequired" onchange="onKeywayRequiredChange()">
              <option>Yes</option>
              <option selected>No</option>
            </select>
          </div>

          <div>
            <label for="keyway">Keyway Size</label>
            <input id="keyway" oninput="calculateAndRender()" />
            <span id="standardKeyway" class="help">Standard:</span>
          </div>

          <div>
            <label for="grub">Grub Screws</label>
            <select id="grub" onchange="calculateAndRender()">
              <option selected>0</option>
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
            </select>
          </div>

          <div data-archived-machining hidden>
            <label for="outsideGrooves">Outside Grooves</label>
            <select id="outsideGrooves" onchange="calculateAndRender()">
              <option selected>0</option>
              <option>1</option>
              <option>2</option>
              <option>3</option>
            </select>
          </div>

          <div data-archived-machining hidden>
            <label for="internalCirclipGrooves">Internal Circlip Grooves</label>
            <select id="internalCirclipGrooves" onchange="calculateAndRender()">
              <option selected>0</option>
              <option>1</option>
              <option>2</option>
              <option>3</option>
            </select>
          </div>

          <div data-archived-machining hidden>
            <label for="bossRemoved">Boss Removed</label>
            <select id="bossRemoved" onchange="calculateAndRender()">
              <option selected>No</option>
              <option>Yes</option>
            </select>
          </div>

          <div>
            <label for="material">Material</label>
            <select id="material" onchange="calculateAndRender()">
              <option>Mild Steel</option>
              <option>Stainless Steel</option>
              <option>Aluminium</option>
            </select>
          </div>

          <div>
            <label for="qty">Quantity</label>
            <input id="qty" type="number" min="1" max="100" value="1" oninput="calculateAndRender()" />
          </div>

          <div class="summary-box" id="summaryBox">
            <strong>Selected:</strong><br />
          </div>
        </div>
        <div id="quoteOutput" class="quote-output" role="status" aria-live="polite"></div>
      </div>

      <aside class="card">
        <h2>£ Quote Price</h2>
        <div class="price-box">
          <p class="price-label">Unit price</p>
          <div id="unitPrice" class="unit-price">£0.00</div>
          <p class="price-label">Line total</p>
          <div id="lineTotal" class="line-total">£0.00</div>
        </div>
        <div id="priceDetails" class="details"></div>
        <div id="warning" class="warning"></div>
        <p id="pricingStatus" class="help" role="status" aria-live="polite"></p>
      </aside>
    </section>


    <footer class="version-footer" id="appVersionFooter">MTEC Bore &amp; Key — Version 4.2</footer>
  </main>

  <script>
    // Version information is defined here so the header, admin panel, footer
    // and emailed order summary always refer to the same release.
    const APP_VERSION = "4.2";
    const APP_BUILD_DATE = "22 October 2026";
    

    // Deferred features: the original controls, Admin rates and pricing code remain
    // in this file for a future release. OFF means no visible fields, no charges,
    // no order-summary rows, and no blank grid cells. Leave OFF until approved.
    const ARCHIVED_MACHINING_ENABLED = false;

    function applyArchivedMachiningVisibility() {
      document.querySelectorAll("[data-archived-machining]").forEach(element => {
        element.hidden = !ARCHIVED_MACHINING_ENABLED;
      });
    }

    function displayAppVersion() {
      const versionName = `Version ${APP_VERSION}`;
      document.title = "MTEC Bore and Key Quoting Tool";
      document.getElementById("appVersionHeader").textContent = versionName;
      
      
      document.getElementById("appVersionFooter").textContent = `MTEC Bore & Key — ${versionName}`;
    }

    const defaultSettings = {
      minimum_price: 13.50,
      grub_screw_price: 3.00,
      grub_screw_second_price: 2.50,
      grub_screw_additional_price: 2.00,
      outside_groove_price: 0,
      internal_circlip_groove_price: 0,
      boss_removal_price: 0,
      stainless_multiplier: 1.20,
      aluminium_multiplier: 1.00,
      non_standard_keyway_uplift: 10.0,
      standard_keyway_uplift: 25.0,
      general_price_increase: 0.0,
      metric_tiers: [
        { name: "6-20mm", max_bore: 20, base_price: 13.50, length_rate: 3.00 },
        { name: "21-25mm", max_bore: 25, base_price: 14.50, length_rate: 3.50 },
        { name: "26-30mm", max_bore: 30, base_price: 15.00, length_rate: 4.00 },
        { name: "31-35mm", max_bore: 35, base_price: 20.00, length_rate: 4.50 },
        { name: "36-40mm", max_bore: 40, base_price: 26.00, length_rate: 5.50 },
        { name: "41-45mm", max_bore: 45, base_price: 32.00, length_rate: 6.50 },
        { name: "46-50mm", max_bore: 50, base_price: 38.00, length_rate: 7.50 },
        { name: "51-55mm", max_bore: 55, base_price: 43.00, length_rate: 8.50 },
        { name: "56-60mm", max_bore: 60, base_price: 45.00, length_rate: 9.50 }
      ],

      quantity_discounts: [
        { min_qty: 1, max_qty: 4, discount: 0 },
        { min_qty: 5, max_qty: 10, discount: 2 },
        { min_qty: 11, max_qty: 30, discount: 5 },
        { min_qty: 31, max_qty: 100, discount: 8 }
      ]
    };

    // Customer release: approved fixed rates, not editable or loaded from browser storage.
    let settings = JSON.parse(JSON.stringify(defaultSettings));
    function clone(obj) { return JSON.parse(JSON.stringify(obj)); }


    const PRICING_FILE = "pricing.json";
    function validatePublishedPricing(payload) {
      if (!payload || payload.schema_version !== 1 || !payload.settings || typeof payload.settings !== "object") {
        throw new Error("Invalid pricing file format");
      }
      const raw = payload.settings;
      const numericKeys = ["minimum_price","grub_screw_price","grub_screw_second_price","grub_screw_additional_price","outside_groove_price","internal_circlip_groove_price","boss_removal_price","stainless_multiplier","aluminium_multiplier","non_standard_keyway_uplift","standard_keyway_uplift","general_price_increase"];
      const result = clone(defaultSettings);
      for (const key of numericKeys) {
        if (typeof raw[key] !== "number" || !Number.isFinite(raw[key]) || raw[key] < 0 || raw[key] > 100000) throw new Error("Invalid setting: " + key);
        result[key] = raw[key];
      }
      if (!Array.isArray(raw.metric_tiers) || raw.metric_tiers.length !== 9) throw new Error("Expected nine metric pricing tiers");
      result.metric_tiers = raw.metric_tiers.map((tier,index) => {
        const expected = [20,25,30,35,40,45,50,55,60][index];
        if (!tier || tier.max_bore !== expected || !Number.isFinite(tier.base_price) || tier.base_price < 0 ||
            !Number.isFinite(tier.length_rate) || tier.length_rate < 0 || typeof tier.name !== "string") throw new Error("Invalid metric tier: " + expected);
        return {name: tier.name, max_bore: expected, base_price: tier.base_price, length_rate: tier.length_rate};
      });
      if (!Array.isArray(raw.quantity_discounts) || raw.quantity_discounts.length !== 4) throw new Error("Invalid quantity table");
      result.quantity_discounts = raw.quantity_discounts.map((row,index) => {
        const expected = [[1,4],[5,10],[11,30],[31,100]][index];
        if (!row || row.min_qty !== expected[0] || row.max_qty !== expected[1] || !Number.isFinite(row.discount) || row.discount < 0 || row.discount >= 100) throw new Error("Invalid quantity band");
        return {min_qty: row.min_qty, max_qty: row.max_qty, discount: row.discount};
      });
      return result;
    }

    function pricingPayload() {
      return {
        schema_version: 1,
        published_at: new Date().toISOString(),
        settings: clone(settings)
      };
    }

    function money(value) {
      return "£" + Number(value).toFixed(2);
    }

    function gcd(a, b) {
      return b ? gcd(b, a % b) : a;
    }

    function formatInch(value) {
      const whole = Math.floor(value);
      const frac = value - whole;
      const den = 32;
      let num = Math.round(frac * den);
      if (num === 0) return `${whole}"`;
      if (num === den) return `${whole + 1}"`;
      const div = gcd(num, den);
      num /= div;
      const reducedDen = den / div;
      return whole > 0 ? `${whole} ${num}/${reducedDen}"` : `${num}/${reducedDen}"`;
    }

    function parseImperial(text) {
      text = String(text).replace(/"/g, "").trim();
      if (!text) return 0;
      if (text.includes("/")) {
        const parts = text.split(" ");
        const whole = parts.length === 2 ? Number(parts[0]) : 0;
        const frac = parts.length === 2 ? parts[1] : parts[0];
        const [n, d] = frac.split("/").map(Number);
        if (!Number.isFinite(n) || !Number.isFinite(d) || d === 0) return 0;
        return whole + (n / d);
      }
      return Number(text);
    }

    function metricKeyway(bore) {
      bore = Number(bore);
      if (bore <= 8) return 2;
      if (bore <= 10) return 3;
      if (bore <= 12) return 4;
      if (bore <= 17) return 5;
      if (bore <= 22) return 6;
      if (bore <= 30) return 8;
      if (bore <= 38) return 10;
      if (bore <= 44) return 12;
      if (bore <= 50) return 14;
      if (bore <= 58) return 16;
      if (bore <= 65) return 18;
      if (bore <= 75) return 20;
      if (bore <= 85) return 22;
      if (bore <= 95) return 25;
      return 28;
    }

    function imperialKeyway(bore) {
      bore = Number(bore);
      if (bore <= 5 / 16) return 1 / 16;
      if (bore <= 7 / 16) return 3 / 32;
      if (bore <= 9 / 16) return 1 / 8;
      if (bore <= 7 / 8) return 3 / 16;
      if (bore <= 1.25) return 1 / 4;
      if (bore <= 1.375) return 5 / 16;
      if (bore <= 1.75) return 3 / 8;
      if (bore <= 2.25) return 1 / 2;
      if (bore <= 2.75) return 5 / 8;
      if (bore <= 3.25) return 3 / 4;
      if (bore <= 3.75) return 7 / 8;
      return 1;
    }

    function getTier(bore, tiers) {
      return tiers.find(t => Number(bore) <= Number(t.max_bore)) || tiers[tiers.length - 1];
    }

    function getQtyDiscount(qty) {
      const band = settings.quantity_discounts.find(b => qty >= Number(b.min_qty) && qty <= Number(b.max_qty));
      return band ? Number(band.discount) / 100 : 0;
    }

    function getInputState() {
      return {
        unit: document.getElementById("unit").value,
        boreRaw: document.getElementById("bore").value,
        lengthRaw: document.getElementById("length").value,
        keywayRequired: document.getElementById("keywayRequired").value,
        keywayRaw: document.getElementById("keyway").value,
        grub: Math.max(0, Math.min(5, Number(document.getElementById("grub").value || 0))),
        outsideGrooves: ARCHIVED_MACHINING_ENABLED ? Math.max(0, Math.min(3, Number(document.getElementById("outsideGrooves").value || 0))) : 0,
        internalCirclipGrooves: ARCHIVED_MACHINING_ENABLED ? Math.max(0, Math.min(3, Number(document.getElementById("internalCirclipGrooves").value || 0))) : 0,
        bossRemoved: ARCHIVED_MACHINING_ENABLED ? document.getElementById("bossRemoved").value : "No",
        material: document.getElementById("material").value,
        qty: Math.max(1, Math.min(100, Number(document.getElementById("qty").value || 1)))
      };
    }

    function calculateGrubScrewCharge(count) {
      const n = Math.max(0, Math.min(5, Math.trunc(Number(count) || 0)));
      return (n >= 1 ? Number(settings.grub_screw_price) : 0)
        + (n >= 2 ? Number(settings.grub_screw_second_price) : 0)
        + Math.max(0, n - 2) * Number(settings.grub_screw_additional_price);
    }

    function calculateQuoteFromState(state) {
      let bore, length, standardKeyway, enteredKeyway, tier, lengthIncrements;

      if (state.unit === "Metric") {
        bore = Number(state.boreRaw);
        length = Number(state.lengthRaw);
        standardKeyway = metricKeyway(bore);
        enteredKeyway = Number(state.keywayRaw);
        tier = getTier(bore, settings.metric_tiers);
        lengthIncrements = Math.max(0, (length - 30) / 20);
      } else {
        bore = parseImperial(state.boreRaw);
        length = parseImperial(state.lengthRaw);
        standardKeyway = imperialKeyway(bore);
        enteredKeyway = parseImperial(state.keywayRaw);
        // Same Mild Steel prices for physically equivalent imperial and metric sizes.
        const boreMm = bore * 25.4;
        const lengthMm = length * 25.4;
        tier = getTier(boreMm, settings.metric_tiers);
        lengthIncrements = Math.max(0, (lengthMm - 30) / 20);
      }

      // The range restriction must work even when calculateQuoteFromState is called
      // directly, not only through the bore selector.
      if (state.unit === "Metric" && (!Number.isFinite(bore) || bore < 6 || bore > 60)) {
        throw new RangeError("Metric bore must be between 6 and 60 mm.");
      }
      if (state.unit === "Imperial" && (!Number.isFinite(bore) || bore < 0.25 || bore > 2.3125)) {
        throw new RangeError("Imperial bore must be between 1/4 and 2 5/16 inches (within 6–60 mm range).");
      }

      let materialMultiplier = 1;
      if (state.material === "Stainless Steel") materialMultiplier = Number(settings.stainless_multiplier);
      if (state.material === "Aluminium") materialMultiplier = Number(settings.aluminium_multiplier);

      const hasKeyway = state.keywayRequired === "Yes";
      const isNonStandard = hasKeyway && Math.abs(Number(enteredKeyway) - Number(standardKeyway)) > 0.0001;
      const standardKeywayMultiplier = hasKeyway ? 1 + Number(settings.standard_keyway_uplift) / 100 : 1;
      const nonStandardMultiplier = isNonStandard ? 1 + Number(settings.non_standard_keyway_uplift) / 100 : 1;
      const qtyDiscount = getQtyDiscount(state.qty);

      // Bore-only baseline, then positive charges for the keyway if required.
      const boreOnly = Number(tier.base_price) + lengthIncrements * Number(tier.length_rate);
      const boreWithKeyway = boreOnly * standardKeywayMultiplier * nonStandardMultiplier;

      // Other machining does not attract an extra keyway percentage.
      // Existing quantity discounts continue to apply to these operations.
      const otherMachining = ARCHIVED_MACHINING_ENABLED
        ? (state.outsideGrooves || 0) * Number(settings.outside_groove_price)
          + (state.internalCirclipGrooves || 0) * Number(settings.internal_circlip_groove_price)
          + (state.bossRemoved === "Yes" ? Number(settings.boss_removal_price) : 0)
        : 0;
      const discountedMachining = (boreWithKeyway + otherMachining) * (1 - qtyDiscount);

      // Grub screws retain fixed progressive rates, outside quantity discounts.
      const grubCharge = calculateGrubScrewCharge(state.grub);
      const beforeMaterialMultiplier = Math.max(Number(settings.minimum_price), discountedMachining) + grubCharge;
      // Approved 3.7 material policy: Aluminium matches Mild Steel; Stainless
      // adds 20% across ALL machining, including the progressive grub charge.
      // Apply the material multiplier once after minimum/quantity handling.
      const beforeGeneralIncrease = beforeMaterialMultiplier * materialMultiplier;
      // General increase applies once to the complete price.
      const increaseMultiplier = 1 + Number(settings.general_price_increase) / 100;
      const unitPrice = beforeGeneralIncrease * increaseMultiplier;

      return {
        ...state,
        bore,
        length,
        standardKeyway,
        enteredKeyway,
        unitPrice,
        boreOnly,
        boreWithKeyway,
        otherMachining,
        grubCharge,
        lineTotal: unitPrice * state.qty,
        isNonStandard,
        qtyDiscount,
        unpricedOperations: ARCHIVED_MACHINING_ENABLED ? [
          state.outsideGrooves > 0 && Number(settings.outside_groove_price) === 0 ? "Outside Grooves" : null,
          state.internalCirclipGrooves > 0 && Number(settings.internal_circlip_groove_price) === 0 ? "Internal Circlip Grooves" : null,
          state.bossRemoved === "Yes" && Number(settings.boss_removal_price) === 0 ? "Boss Removed" : null
        ].filter(Boolean) : []
      };
    }

    function calculateQuote() {
      return calculateQuoteFromState(getInputState());
    }

    function populateDropdowns() {
      const unit = document.getElementById("unit").value;
      const bore = document.getElementById("bore");
      const length = document.getElementById("length");
      bore.innerHTML = "";
      length.innerHTML = "";

      if (unit === "Metric") {
        for (let i = 6; i <= 60; i++) {
          bore.add(new Option(`${i} mm`, String(i)));
        }
        [30, 50, 70, 90, 100, 110].forEach(v => length.add(new Option(`${v} mm`, String(v))));
        bore.value = "25";
        length.value = "30";
        document.getElementById("keyway").value = "8";
      } else {
        for (let n = 4; n <= 37; n++) {
          const value = n / 16;
          bore.add(new Option(formatInch(value), formatInch(value)));
        }
        [1, 1.5, 2, 2.5, 3, 3.5, 4].forEach(v => length.add(new Option(formatInch(v), formatInch(v))));
        bore.value = '1 1/2"';
        length.value = '4"';
        document.getElementById("keyway").value = '3/8"';
      }
    }

    function onUnitChange() {
      populateDropdowns();
      updateStandardKeyway();
      calculateAndRender();
    }

    function onBoreChange() {
      updateStandardKeyway();
      const unit = document.getElementById("unit").value;
      if (document.getElementById("keywayRequired").value === "Yes") {
        if (unit === "Metric") {
          const bore = Number(document.getElementById("bore").value);
          document.getElementById("keyway").value = String(metricKeyway(bore));
        } else {
          const bore = parseImperial(document.getElementById("bore").value);
          document.getElementById("keyway").value = formatInch(imperialKeyway(bore));
        }
      }
      calculateAndRender();
    }

    function onKeywayRequiredChange() {
      const disabled = document.getElementById("keywayRequired").value === "No";
      const keyway = document.getElementById("keyway");
      keyway.disabled = disabled;
      if (!disabled) {
        // Re-select the standard key for the CURRENT bore when Yes is chosen,
        // even if the diameter was changed while the keyway was disabled.
        const unit = document.getElementById("unit").value;
        keyway.value = unit === "Metric"
          ? String(metricKeyway(Number(document.getElementById("bore").value)))
          : formatInch(imperialKeyway(parseImperial(document.getElementById("bore").value)));
      }
      updateStandardKeyway();
      calculateAndRender();
    }

    function updateStandardKeyway() {
      const unit = document.getElementById("unit").value;
      let standard;
      if (unit === "Metric") {
        standard = metricKeyway(Number(document.getElementById("bore").value)) + " mm";
      } else {
        standard = formatInch(imperialKeyway(parseImperial(document.getElementById("bore").value)));
      }
      document.getElementById("standardKeyway").textContent = "Standard: " + standard;
    }

    function calculateAndRender() {
      const result = calculateQuote();
      if (!customerPricingReady && location.protocol !== "file:") {
        document.getElementById("unitPrice").textContent = "—";
        document.getElementById("lineTotal").textContent = "—";
        document.getElementById("quoteOutput").textContent = "Current prices unavailable. Contact MTEC for a quotation.";
        return;
      }
      // As in the original live tool, keep the order summary visible and current.
      document.getElementById("quoteOutput").textContent = buildQuoteText();
      document.getElementById("unitPrice").textContent = money(result.unitPrice);
      document.getElementById("lineTotal").textContent = money(result.lineTotal);

      const keywayText = document.getElementById("keywayRequired").value === "Yes"
        ? document.getElementById("keyway").value
        : "No keyway";

      const deferredDetails = ARCHIVED_MACHINING_ENABLED
        ? `<br>Outside grooves: ${result.outsideGrooves}<br>Internal circlip grooves: ${result.internalCirclipGrooves}<br>Boss removed: ${result.bossRemoved}`
        : "";
      const safeText = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      document.getElementById("summaryBox").innerHTML =
        `<strong>Selected:</strong><br>${safeText(result.boreRaw)} bore × ${safeText(result.lengthRaw)} long<br>Keyway: ${safeText(keywayText)}<br>Grub screws: ${result.grub}${deferredDetails}<br>Material: ${safeText(result.material)}<br>Qty: ${result.qty}`;

      // Customer view: no internal percentage breakdown or individual rates.
      // Quantity discount may be shown, as requested.
      const priceDetails = document.getElementById("priceDetails");
      priceDetails.textContent = result.qtyDiscount > 0
        ? `Machining quantity discount: ${(result.qtyDiscount * 100).toFixed(0)}%`
        : "";
      priceDetails.style.display = result.qtyDiscount > 0 ? "block" : "none";

      const warning = document.getElementById("warning");
      const warnings = [];
      if (result.isNonStandard) {
        warnings.push("Non-standard keyway uplift applied.");
      }
      if (result.unpricedOperations.length) {
        warnings.push("NOT YET PRICED: " + result.unpricedOperations.join(", ") + ". Contact MTEC for pricing before placing an order.");
      }
      warning.style.display = warnings.length ? "block" : "none";
      warning.textContent = warnings.join("\n");

    }

    function buildQuoteText() {
      const r = calculateQuote();
      const keywayText = r.keywayRequired === "Yes" ? r.keywayRaw : "No keyway";
      const deferredOrderDetails = ARCHIVED_MACHINING_ENABLED
        ? `\nOutside grooves: ${r.outsideGrooves}\nInternal circlip grooves: ${r.internalCirclipGrooves}\nBoss removed: ${r.bossRemoved}`
        : "";
      return `MTEC Bore and Key Order Summary
Tool version: Version ${APP_VERSION}
Unit system: ${r.unit}
Bore: ${r.boreRaw}
Length: ${r.lengthRaw}
Keyway: ${keywayText}
Grub screws: ${r.grub}${deferredOrderDetails}
Material: ${r.material}
Quantity: ${r.qty}

Unit price: ${money(r.unitPrice)}
Line total: ${money(r.lineTotal)}${r.isNonStandard ? "\nNon-standard keyway uplift applied." : ""}${r.unpricedOperations.length ? "\n\nWARNING - Additional machining not yet priced: " + r.unpricedOperations.join(", ") : ""}`;
    }

    function copyQuote() {
      if (!customerPricingReady && window.location.protocol !== "file:") {
        alert("Live pricing is currently unavailable. Please contact MTEC for a quotation.");
        return;
      }
      const result = calculateQuote();
      if (result.unpricedOperations.length && !confirm("Some selected additional machining operations have not yet been priced. Continue with Place Order anyway?")) return;
      const text = buildQuoteText();

      const subject = encodeURIComponent("MTEC Bore and Key Order Request");
      const body = encodeURIComponent(
`Hello,

Please process the following machining order:

${text}

Thank you.`
      );

      window.location.href = `mailto:sales@mtecltd.co.uk?subject=${subject}&body=${body}`;

      document.getElementById("quoteOutput").textContent = text;
    }

    function resetQuote(event) {
      // Never submit a parent form or navigate/reload the page.
      // Resetting the quote must not alter the customer's saved Admin pricing.
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      document.getElementById("unit").value = "Metric";
      populateDropdowns(); // 25 mm bore, 30 mm long.
      document.getElementById("keywayRequired").value = "No";
      document.getElementById("keyway").value = String(metricKeyway(Number(document.getElementById("bore").value)));
      document.getElementById("grub").value = "0";
      document.getElementById("outsideGrooves").value = "0";
      document.getElementById("internalCirclipGrooves").value = "0";
      document.getElementById("bossRemoved").value = "No";
      document.getElementById("material").value = "Mild Steel";
      document.getElementById("qty").value = "1";
      document.getElementById("quoteOutput").textContent = "";
      updateStandardKeyway();
      onKeywayRequiredChange(); // Re-enables keyway and refreshes quote on this page.
      return false;
    }


    let customerPricingReady = false;
    async function loadPublishedPrices() {
      const status = document.getElementById("pricingStatus");
      if (location.protocol === "file:") {
        status.textContent = "Local preview — using the packaged prices. Online publishing is not connected in this preview.";
        return;
      }
      status.textContent = "Loading current MTEC prices…";
      document.querySelector(".place-order-btn").disabled = true;
      try {
        const response = await fetch("./" + PRICING_FILE + "?v=" + Date.now(), {cache:"no-store"});
        if (!response.ok) throw new Error("Pricing file returned " + response.status);
        const data = await response.json();
        settings = validatePublishedPricing(data);
        customerPricingReady = true;
        status.textContent = "";
        document.querySelector(".place-order-btn").disabled = false;
        calculateAndRender();
      } catch (error) {
        console.error("Could not load current MTEC prices:",error);
        status.textContent = "Live prices are temporarily unavailable. Please contact MTEC to confirm your quotation.";
        document.getElementById("unitPrice").textContent = "—";
        document.getElementById("lineTotal").textContent = "—";
        document.getElementById("quoteOutput").textContent = "Current prices unavailable. Contact MTEC for a quotation.";
        document.querySelector(".place-order-btn").disabled = true;
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }

    displayAppVersion();
    applyArchivedMachiningVisibility();
    populateDropdowns();
    updateStandardKeyway();
    onKeywayRequiredChange(); // Initial default: No Keyway.
    loadPublishedPrices();
  </script>
</body>
</html>
